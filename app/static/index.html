<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流萤</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="bg"></div>
<div id="app">
    <div id="header">
        <div class="avatar"></div>
        <div>
            <div class="name">流萤</div>
            <div class="status">在线</div>
        </div>
    </div>
    <div id="messages"></div>
    <div id="input-bar">
        <input type="text" id="msg-input" placeholder="说点什么…" maxlength="500" autofocus>
        <button id="send-btn" title="发送">▶</button>
    </div>
    <!-- Key 配置面板 -->
    <div id="key-panel" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:99; display:flex; align-items:center; justify-content:center;">
        <div style="background:#1e1e30; padding:24px; border-radius:12px; width:360px; text-align:center;">
            <div style="color:#e0d5c1; font-size:1em; margin-bottom:16px;">输入 DeepSeek API Key</div>
            <input id="key-input" type="password" placeholder="sk-..." style="width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.08); color:#e0d5c1; font-family:inherit;">
            <button id="key-save" style="margin-top:12px; width:100%; padding:10px; border-radius:8px; border:none; background:rgba(140,160,200,0.3); color:#c8d0e0; font-family:inherit; cursor:pointer;">保存</button>
        </div>
    </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
