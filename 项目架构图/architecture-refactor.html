:root{

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg1);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.7;overflow-x:hidden}

#layout{display:flex;min-height:100vh}
/* ── 侧边导航 ── */
#nav{width:var(--nav-w);flex:0 0 var(--nav-w);position:sticky;top:0;height:100vh;overflow-y:auto;

#nav .brand small{display:block;color:var(--faint);font-weight:400;font-size:11px;margin-top:2px}
#nav button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;

#nav button.on{background:var(--panel-hi);color:var(--fire);border-color:var(--line)}
#nav .grp{margin:14px 8px 4px;font-size:11px;color:var(--faint);letter-spacing:1px}

#main{flex:1;min-width:0;padding:26px 30px 80px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:24px;font-weight:700;margin-bottom:6px}
h2{font-size:18px;color:var(--warm);margin:30px 0 12px;padding-left:10px;border-left:3px solid var(--warm)}
h3{font-size:15px;color:var(--cyan);margin:18px 0 8px}
.sub{color:var(--dim);margin-bottom:18px;max-width:1000px}
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
code,.mono{font-family:var(--mono);font-size:12.5px;background:rgba(125,211,252,.08);border:1px solid rgba(125,211,252,.16);border-radius:5px;padding:1px 6px;color:var(--cyan)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line-soft);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--panel-hi);color:var(--warm);font-weight:600;white-space:nowrap}
tr:hover td{background:rgba(26,34,60,.4)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid;margin:1px 3px 1px 0;white-space:nowrap}
.t-p0{color:var(--red);border-color:var(--red)}.t-p1{color:var(--warm);border-color:var(--warm)}
.t-p2{color:var(--cyan);border-color:var(--cyan)}.t-p3{color:var(--dim);border-color:var(--faint)}
.t-fixed{color:var(--green);border-color:var(--green)}.t-open{color:var(--orange);border-color:var(--orange)}
.t-own{color:var(--violet);border-color:var(--violet)}
.muted{color:var(--faint)}.small{font-size:12.5px}

svg text{font-family:var(--body)}
.node{cursor:pointer;transition:filter .15s}
.node:hover{filter:brightness(1.35)}
.edge{stroke:var(--faint);stroke-width:1.4;fill:none;marker-end:url(#arr)}
.edge-lab{font-size:10.5px;fill:var(--dim)}

.hbar{display:flex;align-items:center;gap:10px;padding:3px 6px;border-radius:7px}
.hbar:hover{background:var(--panel-hi)}
.hbar .nm{font-family:var(--mono);font-size:12px;width:340px;flex:0 0 340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.hbar .bar{height:14px;border-radius:4px;min-width:3px}
.hbar .ln{font-family:var(--mono);font-size:11.5px;color:var(--faint);width:110px;flex:0 0 110px;text-align:right}
/* ── 路线图 ── */
.phase{border-left:3px solid var(--violet);padding:4px 0 14px 18px;position:relative;margin-left:8px}
.phase::before{content:"";position:absolute;left:-8px;top:8px;width:13px;height:13px;border-radius:50%;background:var(--bg2);border:2px solid var(--violet)}
.phase h3{margin-top:0}
/* ── 状态机 ── */
.fsm{display:inline-block;vertical-align:top;margin:0 14px 18px 0;min-width:330px}
/* ── 过滤器 ── */
.filters{margin:0 0 14px}
.filters button{background:var(--panel);border:1px solid var(--line-soft);color:var(--dim);border-radius:20px;
  padding:4px 14px;font-size:12.5px;cursor:pointer;margin-right:8px;font-family:var(--body)}
.filters button.on{color:var(--fire);border-color:var(--fire)}
/* ── 步骤流 ── */
.steps{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}
.step{background:var(--panel-hi);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;max-width:240px;font-size:12.8px}
.step b{color:var(--warm);display:block;margin-bottom:3px;font-size:13px}
.step .mono{display:block;margin-top:4px}
.arrow{align-self:center;color:var(--fire);font-size:18px;padding:0 7px}
.toc-note{font-size:12px;color:var(--faint);margin-top:10px}
@media(max-width:900px){#nav{position:fixed;z-index:5;transform:translateX(-100%)}#main{padding:16px}}

function svgWrap(w,h,inner){
  return `<div class="diagram"><svg viewBox="0 0 ${w} ${h}" width="100%" style="min-width:${Math.min(w,900)}px">

function snode(x,y,w,h,t,sub,color){
  return `<g class="node"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"
    fill="rgba(26,34,60,.9)" stroke="${color||"rgba(217,242,79,.35)"}" stroke-width="1.3"/>

    <title>${esc(t)}${sub?" — "+esc(sub):""}</title></g>`;
}
function sedge(x1,y1,x2,y2,lab,cls){
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  return `<path class="edge ${cls||""}" d="M${x1},${y1} L${x2},${y2}"/>`+
    (lab?`<text class="edge-lab" x="${mx}" y="${my-4}" text-anchor="middle">${esc(lab)}</text>`:"");
}

  lanes.forEach(([x,t])=>{ s+=snode(x,20,280,44,t,"","rgba(125,211,252,.45)"); });
  const F=[
    [200,940,300,"direct：_CompatClient（Key 在本地 config.json）",110],
    [500,940,300,"proxy：QuotaClient 运营者 Key · proxy_usage 按日记账",170],
    [500,940,300,"relay 回写：/relay/result（APP 1s 轮询代发）",230],
    [940,500,300,"relay 下发：/relay/pending",290],
    [200,500,300,"同步：manifest→import↑→export↓（行合并/新者胜/blob）",350],
    [200,500,300,"快照上云：snapshot/create（每账号 5 份滚动）",410],

    [940,500,300,"下载/更新：8787 /download + releases 双源",530],

/* ⑨ 状态机 */
function renderFsm(){

  b.innerHTML = h;

/* ⑩ 热力图 */
function renderHeatmap(){
  const b = view("heatmap","⑩ 文件行数热力图",
    `阈值（Python/JS/Kotlin 通用，理由：本项目函数密度高、注释密）：<span class="tag t-p0">>800 必须拆分</span>
     <span class="tag t-p1">500-800 重点</span><span class="tag t-p2">300-500 警告</span><span class="tag t-fixed"><300 健康</span>；
     函数 >50 行警告 / >80 行重点（已知最大：routes.py chat() ≈215 行）。点击行尾标签可按域筛选。`);
  const colors={hot:"var(--red)",warn:"var(--orange)",mid:"var(--warm)",ok:"var(--green)",art:"var(--faint)"};
  let h=`<div class="filters" id="hf"></div><div id="hlist" class="panel">`;
  const domains=["全部","路由","内核","领域","服务器","前端","安卓壳","入口","编排"];
  b.innerHTML = h+"</div>";
  const flt=b.querySelector("#hf");
  domains.forEach((d,i)=>{
    const btn=document.createElement("button"); btn.textContent=d; if(i===0)btn.className="on";
    btn.onclick=()=>{ flt.querySelectorAll("button").forEach(x=>x.classList.remove("on")); btn.classList.add("on"); draw(d); };
    flt.appendChild(btn);
  });
  function draw(d){
    const list=b.querySelector("#hlist");
    const rows=D.heatmap.filter(r=>d==="全部"||r[2].startsWith(d)||r[2].includes(d));
    const max=Math.max(...rows.map(r=>r[1]),1);
    list.innerHTML = rows.map(r=>`<div class="hbar"><span class="nm" title="${esc(r[0])}">${esc(r[0])}</span>
      <span class="bar" style="width:${Math.max(3,Math.round(r[1]/max*560))}px;background:${colors[r[3]]}"></span>
      <span class="ln">${r[1]} 行 ${r[3]==="art"?"（产物）":""}</span></div>`).join("")+
      `<div class="small muted" style="margin-top:8px">拆分方案见 ⑬ 目标架构 与报告「超大文件拆分方案」。bundle.js / index.html / style.css 为前端产物或大静态件，其中 index.html(975) 与 style.css(1331) 建议随前端模块化一并切分。</div>`;
  }
  draw("全部");
}

    `定位：<b>语音是角色卡的属性（包级 capability），引擎是用户级可选外挂</b>。对话流水线零改动——语音是回复的渲染层旁路。`);
  let h = `<div class="panel small"><b>前提事实：</b>${esc(D.voice.premise)}</div>`;
  h += `<h2>槽位结构（卡内声明，引擎外挂）</h2><div class="panel"><pre class="mono" style="white-space:pre-wrap;background:none;border:none;color:var(--ink)">${esc(D.voice.slots)}</pre></div>`;
  h += `<h2>REGISTRY 注册三行（导出/同步/备份自动获得正确排除行为）</h2><table>
    <tr><th>逻辑类型</th><th>路径</th><th>所有者</th><th>同步/导出策略</th><th>理由</th></tr>`;
  for(const r of D.voice.registry)
    h += `<tr><td><code>${esc(r[0])}</code></td><td><code>${esc(r[1])}</code></td><td><span class="tag t-own">${esc(r[2])}</span></td><td class="small">${esc(r[3])}</td><td class="small muted">${esc(r[4])}</td></tr>`;
  h += `</table><h2>运行时数据流（按需合成，不预生成）</h2><div class="steps">`;
  D.voice.flow.forEach((s,i)=>{
    h += `<div class="step" style="max-width:230px"><b>${i+1}. ${esc(s[0])}</b>${esc(s[1])}</div>`;
    if(i<D.voice.flow.length-1) h += `<div class="arrow">→</div>`;
  });
  h += `</div><h2>硬约束</h2><div class="panel small">` + D.voice.constraints.map(r=>`· ${esc(r)}`).join("<br>") + `</div>`;
  b.innerHTML = h;
}

/* ════════ 启动 ════════ */
const RENDER = {overview:renderOverview,deps:renderDeps,caps:renderCaps,journeys:renderJourneys,
  ownership:renderOwnership,dataflow:renderDataflow,migration:renderMigration,api:renderApi,
  fsm:renderFsm,heatmap:renderHeatmap,roadmap:renderRoadmap,problems:renderProblems,target:renderTarget,
  packmgmt:renderPackmgmt,voice:renderVoice};
const navEl = document.getElementById("navbtns");
D.nav.forEach(item=>{
  if(item[0]==="grp"){ const g=document.createElement("div"); g.className="grp"; g.textContent=item[1]; navEl.appendChild(g); return; }
  const btn=document.createElement("button"); btn.textContent=item[1]; btn.dataset.v=item[0];
  btn.onclick=()=>{ navEl.querySelectorAll("button").forEach(x=>x.classList.remove("on")); btn.classList.add("on"); show(item[0]); };
  navEl.appendChild(btn);
});
const done = {};
function show(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  if(!done[id]){ RENDER[id](); done[id]=true; }
  document.getElementById("v-"+id).classList.add("on");
  window.scrollTo(0,0);
}
navEl.querySelector("button").classList.add("on");
show("overview");
</script>
</body>
